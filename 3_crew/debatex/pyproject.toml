[project]
name = "debatex"
version = "0.1.0"
description = "debatex using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.13.0"
]

[project.scripts]
debatex = "debatex.main:run"
run_crew = "debatex.main:run"
train = "debatex.main:train"
replay = "debatex.main:replay"
test = "debatex.main:test"
run_with_trigger = "debatex.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
